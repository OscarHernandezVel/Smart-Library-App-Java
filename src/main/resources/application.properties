spring.application.name=smart-library-app

# H2 en memoria: se crea al arrancar y se borra al detenerse
spring.datasource.url=jdbc:h2:mem:smartlibrary;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Carga de estudiantes y libros de ejemplo (data.sql) después de crear el esquema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Consola de H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:smartlibrary, usuario: sa)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
